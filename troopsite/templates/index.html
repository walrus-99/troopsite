<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Troopsite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="eyebrow">FastAPI + HTTPX + SQLite</p>
        <h1>Troopsite is running.</h1>
        <p>This starter page is rendered by FastAPI and backed by a SQLite database.</p>
        <p class="metric">Parents: <strong>{{ parent_count }}</strong></p>
        <p class="metric">Members: <strong>{{ member_count }}</strong></p>
        <a role="button" href="/roster">Manage roster</a>
        <a href="/docs">Open API docs</a>
      </section>
    </main>
  </body>
</html>
