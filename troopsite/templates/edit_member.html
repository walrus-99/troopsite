<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Member | Troopsite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body>
    <main class="container roster-page narrow-page">
      <nav>
        <ul><li><strong>Troopsite</strong></li></ul>
        <ul><li><a href="/roster">Back to roster</a></li></ul>
      </nav>
      <article>
        <h1>Edit member</h1>
        <form method="post" action="/roster/members/{{ member.id }}/edit">
          <div class="grid">
            <label>First name
              <input name="first_name" value="{{ member.first_name }}" required>
            </label>
            <label>Last name
              <input name="last_name" value="{{ member.last_name }}" required>
            </label>
          </div>
          <div class="grid">
            <label>Age
              <input type="number" name="age" min="0" max="120" value="{{ member.age or '' }}" required>
            </label>
            <label>Grade
              <select name="grade" required>
                {% for grade in grades %}
                  <option value="{{ grade.value }}" {% if member.grade == grade %}selected{% endif %}>{{ grade.value }}</option>
                {% endfor %}
              </select>
            </label>
          </div>
          <fieldset class="check-list">
            <legend>Linked parents</legend>
            {% for parent in parents %}
              <label><input type="checkbox" name="parent_ids" value="{{ parent.id }}" {% if parent in member.parents %}checked{% endif %}> {{ parent.first_name }} {{ parent.last_name }}</label>
            {% else %}
              <p class="muted">No parents yet.</p>
            {% endfor %}
          </fieldset>
          <button type="submit">Save member</button>
        </form>
      </article>
    </main>
  </body>
</html>
