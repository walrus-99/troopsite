services:
  troopsite:
    build: .
    container_name: troopsite
    restart: unless-stopped

    networks:
      - web

    labels:
      - traefik.enable=true

      # Main site
      - traefik.http.routers.troopsite.rule=Host(`troop4209.com`) || Host(`www.troop4209.com`)
      - traefik.http.routers.troopsite.entrypoints=websecure
      - traefik.http.routers.troopsite.tls=true
      - traefik.http.routers.troopsite.tls.certresolver=letsencrypt

      # nginx inside the container listens on port 80
      - traefik.http.services.troopsite.loadbalancer.server.port=80

networks:
  web:
    external: true
